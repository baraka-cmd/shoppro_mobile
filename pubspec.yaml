name: shoppro
description: "ShopPro - Application e-commerce professionnelle"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # 🎨 UI & Design
  cupertino_icons: ^1.0.9
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  google_fonts: ^8.2.1
  
  # 🌐 Réseau & API
  dio: ^5.11.0
  connectivity_plus: ^7.3.1
  
  # 🔐 Sécurité & Stockage
  flutter_secure_storage: ^11.0.0
  shared_preferences: ^2.5.5
  
  # 🗄️ Gestion d'état
  provider: ^6.1.5+1
  
  # 📸 Médias
  image_picker: ^1.2.3
  
  # 📝 Validation
  email_validator: ^3.0.0
  
  # 📊 Graphiques (local)
  #fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  # 🖼️ Assets
  assets:
    - assets/images/
    - assets/images/products/
    - assets/images/banners/
    - assets/images/categories/
    - assets/images/brands/
    - assets/images/avatars/
    - assets/js/
    - assets/fonts/
  
  # 🔤 Police Poppins (locale)
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-Italic.ttf
          style: italic