name: shoppro
description: "ShopPro - Application e-commerce professionnelle"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # ============================================
  # UI / DESIGN
  # ============================================
  cupertino_icons: ^1.0.9
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  google_fonts: ^8.2.1

  # ============================================
  # RÉSEAU / API
  # ============================================
  dio: ^5.11.0
  connectivity_plus: ^7.3.1

  # ============================================
  # STOCKAGE LOCAL
  # ============================================
  flutter_secure_storage: ^11.0.0
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6

  # ============================================
  # GESTION D'ÉTAT
  # ============================================
  provider: ^6.1.5+1

  # ============================================
  # MÉDIAS / FICHIERS
  # ============================================
  image_picker: ^1.2.3
  flutter_image_compress: ^2.5.1
  file_picker: ^12.2.0
  open_filex: ^4.7.0

  share_plus: ^13.3.0
  url_launcher: ^6.3.2

  # ============================================
  # VOCAL
  # ============================================
  speech_to_text: ^7.4.0
  permission_handler: ^13.0.1

  # ============================================
  # UTILITAIRES
  # ============================================
  intl: ^0.20.3
  package_info_plus: ^10.2.1
  device_info_plus: ^13.2.0
  uuid: ^4.6.0

  # ============================================
  # WEBVIEW
  # ============================================
  webview_flutter: ^4.14.1

  # ============================================
  # VALIDATION / LOGS
  # ============================================
  email_validator: ^3.0.0
  logger: ^2.7.0

 

 

# ============================================
# ⏸️ DÉSACTIVÉS TEMPORAIREMENT (pas d'internet)
# ============================================
# firebase_core: ^3.6.0
# firebase_messaging: ^15.1.3
# flutter_local_notifications: ^17.2.3
# google_maps_flutter: ^2.9.0
# geolocator: ^12.0.0
# fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/products/
    - assets/images/banners/
    - assets/images/categories/
    - assets/images/brands/
    - assets/images/avatars/
    - assets/images/onboarding/
    - assets/js/
    - assets/fonts/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-Italic.ttf
          style: italic